<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新托福2026完全备考指南</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f8fafc; }
    #root { min-height: 100vh; }

    /* 移动端优化 */
    @media (max-width: 600px) {
      .tab-bar button { padding: 8px 10px !important; font-size: 12px !important; }
      .content-area { padding: 16px 10px !important; }
      .header-area { padding: 16px 12px 0 !important; }
      table { font-size: 12px !important; }
      td, th { padding: 6px 8px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { createRoot } = ReactDOM;
    const { useState } = React;

    const colors = {
      bg: "#f8fafc",
      surface: "#ffffff",
      card: "#f1f5f9",
      border: "#e2e8f0",
      accent: "#2563eb",
      accentSoft: "#dbeafe",
      green: "#059669",
      greenSoft: "#dcfce7",
      yellow: "#d97706",
      yellowSoft: "#fef3c7",
      red: "#dc2626",
      redSoft: "#fee2e2",
      purple: "#7c3aed",
      purpleSoft: "#ede9fe",
      text: "#1e293b",
      textMuted: "#64748b",
      textDim: "#94a3b8",
    };

    const tabs = ["概览", "阅读", "听力", "写作", "口语", "评分", "复习计划"];

    function Badge({ children, color = "accent" }) {
      const map = {
        accent: { bg: colors.accentSoft, text: colors.accent },
        green:  { bg: colors.greenSoft,  text: colors.green  },
        yellow: { bg: colors.yellowSoft, text: colors.yellow },
        red:    { bg: colors.redSoft,    text: colors.red    },
        purple: { bg: colors.purpleSoft, text: colors.purple },
      };
      const c = map[color] || map.accent;
      return (
        <span style={{
          background: c.bg, color: c.text,
          padding: "2px 10px", borderRadius: 99,
          fontSize: 12, fontWeight: 700, letterSpacing: 0.5,
          display: "inline-block"
        }}>{children}</span>
      );
    }

    function Card({ children, style = {} }) {
      return (
        <div style={{
          background: colors.surface, border: `1px solid ${colors.border}`,
          borderRadius: 14, padding: "20px 22px", marginBottom: 16,
          boxShadow: "0 1px 4px rgba(0,0,0,0.06)", ...style
        }}>{children}</div>
      );
    }

    function SectionTitle({ children, icon }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18, marginTop: 8 }}>
          {icon && <span style={{ fontSize: 22 }}>{icon}</span>}
          <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: colors.text }}>{children}</h2>
        </div>
      );
    }

    function SubTitle({ children }) {
      return <h3 style={{ margin: "18px 0 10px", fontSize: 15, fontWeight: 700, color: colors.accent }}>{children}</h3>;
    }

    function Tip({ children, type = "info" }) {
      const map = {
        info:    { border: colors.accent,  bg: colors.accentSoft,  icon: "💡" },
        warn:    { border: colors.yellow,  bg: colors.yellowSoft,  icon: "⚠️" },
        success: { border: colors.green,   bg: colors.greenSoft,   icon: "✅" },
        danger:  { border: colors.red,     bg: colors.redSoft,     icon: "🚫" },
      };
      const c = map[type] || map.info;
      return (
        <div style={{
          borderLeft: `3px solid ${c.border}`, background: c.bg,
          borderRadius: "0 10px 10px 0", padding: "10px 14px",
          marginBottom: 12, fontSize: 13.5, color: colors.text, display: "flex", gap: 8
        }}>
          <span>{c.icon}</span><span>{children}</span>
        </div>
      );
    }

    function Table({ headers, rows }) {
      return (
        <div style={{ overflowX: "auto", marginBottom: 16 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead>
              <tr>
                {headers.map((h, i) => (
                  <th key={i} style={{
                    background: colors.accentSoft, color: colors.accent,
                    padding: "8px 12px", textAlign: "left", fontWeight: 700,
                    borderBottom: `2px solid ${colors.accent}`
                  }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row, i) => (
                <tr key={i} style={{ background: i % 2 === 0 ? colors.bg : colors.card }}>
                  {row.map((cell, j) => (
                    <td key={j} style={{ padding: "8px 12px", color: colors.text, borderBottom: `1px solid ${colors.border}` }}>{cell}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function WeekBlock({ week, phase, tasks, color = "accent" }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ marginBottom: 10, border: `1px solid ${colors.border}`, borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
          <div
            onClick={() => setOpen(!open)}
            style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "12px 16px", cursor: "pointer", background: colors.surface,
              userSelect: "none"
            }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <Badge color={color}>{week}</Badge>
              <span style={{ fontWeight: 700, color: colors.text, fontSize: 14 }}>{phase}</span>
            </div>
            <span style={{ color: colors.textMuted, fontSize: 18 }}>{open ? "▲" : "▼"}</span>
          </div>
          {open && (
            <div style={{ padding: "12px 16px", background: colors.card }}>
              {tasks.map((t, i) => (
                <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, fontSize: 13.5, color: colors.text }}>
                  <span style={{ color: colors.accent, minWidth: 16 }}>•</span>
                  <span>{t}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ======= TAB CONTENT =======

    function OverviewTab() {
      return (
        <div>
          <SectionTitle icon="🆕">2026新托福改革总览</SectionTitle>
          <Tip type="warn">2026年1月21日起，托福iBT正式启用全新改革版本，考试结构、题型、评分体系全面升级。</Tip>

          <Card>
            <SubTitle>🗓️ 考试顺序（已调整）</SubTitle>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              {["阅读 📖", "听力 🎧", "写作 ✍️", "口语 🎤"].map((s, i, arr) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{
                    background: colors.accentSoft, border: `1px solid ${colors.accent}`,
                    borderRadius: 10, padding: "8px 16px", fontWeight: 700, color: colors.accent, fontSize: 15
                  }}>{s}</div>
                  {i < arr.length - 1 && <span style={{ color: colors.textMuted, fontSize: 20 }}>→</span>}
                </div>
              ))}
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13, marginTop: 10 }}>口语从第三位移至最后，有助于考生在最热机状态完成口头表达，减少紧张干扰。</p>
          </Card>

          <Card>
            <SubTitle>⏱️ 各科时长与题量</SubTitle>
            <Table
              headers={["科目", "题量", "时长", "自适应"]}
              rows={[
                ["阅读", "35题（Stage1: 20题 + Stage2: 15题）", "约30分钟", "✅ 是"],
                ["听力", "30题（Stage1: 15题 + Stage2: 15题）", "约29分钟", "✅ 是"],
                ["写作", "12题（3种题型）", "约23分钟", "❌ 否"],
                ["口语", "11-12题（2种题型）", "约8分钟", "❌ 否"],
              ]}
            />
            <Tip type="success">总考试时长约90分钟（核心算分部分），加上不计分的Pretest题约2小时，较旧版大幅缩短。</Tip>
          </Card>

          <Card>
            <SubTitle>📊 评分体系（双轨制 2026-2028过渡期）</SubTitle>
            <Table
              headers={["新制", "旧制对应", "CEFR等级"]}
              rows={[
                ["6分", "115+", "C2"],
                ["5.5分", "110-114", "C1-C2"],
                ["5分", "100-109", "C1"],
                ["4.5分", "90-99", "B2-C1"],
                ["4分", "79-89", "B2"],
                ["3.5分", "68-78", "B1-B2"],
                ["3分", "54-67", "B1"],
              ]}
            />
            <p style={{ color: colors.textMuted, fontSize: 13 }}>总分 = 四科平均分（0.5为最小单位）。2028年起仅保留1-6分制。</p>
          </Card>

          <Card>
            <SubTitle>🔑 改革五大核心变化</SubTitle>
            {[
              ["多阶段自适应", "阅读和听力分Stage1+Stage2，系统根据第一阶段表现动态调整第二阶段难度，高难度题权重更高。"],
              ["生活化场景大增", "阅读融入社交媒体、菜单、海报；听力加入日常对话、短公告；写作考邮件；口语模拟面试。"],
              ["纯学术题比例降低", "冷门学术话题（考古、希腊神话等）大幅减少，但高阶模块依然保留较强学术性。"],
              ["新题型全面上线", "新增：单词填空、微博阅读、听选回复、句子重排（造句）、写邮件、句子复述（口语）、虚拟面试（口语）。"],
              ["出分提速至72小时", "原6-10天缩短至72小时内，更利于把控申请节奏。"],
            ].map(([title, desc], i) => (
              <div key={i} style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                <div style={{
                  minWidth: 28, height: 28, borderRadius: "50%",
                  background: colors.accentSoft, color: colors.accent,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontWeight: 800, fontSize: 13, flexShrink: 0
                }}>{i + 1}</div>
                <div>
                  <div style={{ fontWeight: 700, color: colors.text, fontSize: 14 }}>{title}</div>
                  <div style={{ color: colors.textMuted, fontSize: 13, marginTop: 3 }}>{desc}</div>
                </div>
              </div>
            ))}
          </Card>
        </div>
      );
    }

    function ReadingTab() {
      return (
        <div>
          <SectionTitle icon="📖">阅读（Reading）详解</SectionTitle>
          <Card>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
              <Badge color="accent">35题</Badge>
              <Badge color="green">约30分钟</Badge>
              <Badge color="purple">自适应两阶段</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: 0 }}>
              Stage1（20题固定）→ 系统评估 → Stage2（15题，进入Upper或Lower难度模块）
            </p>
          </Card>

          <SubTitle>📂 三大题型详解</SubTitle>

          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
              <h4 style={{ margin: 0, color: colors.text }}>① 单词填空题（Cloze / Word Completion）</h4>
              <Badge color="yellow">新题型</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "10px 0 6px" }}>
              文章约70-100词，首尾句完整。从第二句第二个词起，连续10个单词被截取后半段，考生根据上下文推断并补全字母。
            </p>
            <Tip type="info">考查：拼写能力 + 阅读理解 + 上下文推断。每个空格的前几个字母会给出，需填写缺失的部分。</Tip>
            <SubTitle>做题要点</SubTitle>
            {["先通读首尾完整句，掌握文章主题方向",
              "依靠词根词缀 + 上下文语境推断单词，不要硬猜",
              "注意词性：动词/名词/形容词的语法位置决定填写答案",
              "ETS喜欢把多个空塞进同一句话，要耐心分析长句结构",
              "加强拼写练习，常见词的拼写错误会直接失分"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green }}>→</span><span>{t}</span>
              </div>
            ))}
          </Card>

          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
              <h4 style={{ margin: 0, color: colors.text }}>② 微型文本阅读（Short Text / Social Media Reading）</h4>
              <Badge color="yellow">新题型</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "10px 0 6px" }}>
              15-150字的碎片文本，包括：菜单、活动海报、Twitter式短帖、即时通讯对话等。每组2-3道单选题。
            </p>
            <Tip type="info">考查：主旨识别 + 非正式语言理解 + 俚语/电报式语言 + 信息检索。</Tip>
            <SubTitle>做题要点</SubTitle>
            {["快速定位关键信息，不要过度解读每个词",
              "注意非正式缩写和俚语：BTW / ASAP / FYI / gonna / wanna等",
              "菜单/海报类：关注价格、时间、地点等具体细节",
              "即时通讯类：判断对话意图、隐含情绪，不被字面意思误导",
              "此类题难度较低，要快速作答节约时间给学术类文章"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green }}>→</span><span>{t}</span>
              </div>
            ))}
          </Card>

          <Card>
            <h4 style={{ margin: "0 0 10px", color: colors.text }}>③ 学术短文阅读（Academic Reading）</h4>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "0 0 6px" }}>
              约200词的学术说明性文章，附5道单选题。话题涵盖历史、艺术、经济、生命科学等，无需背景知识。
            </p>
            <SubTitle>六种传统题型</SubTitle>
            <Table
              headers={["题型", "考查内容", "答题策略"]}
              rows={[
                ["词汇题", "词义辨析/近义词", "结合上下文判断，不要仅凭单词记忆"],
                ["事实信息题", "细节理解", "定位原文段落，逐一对照选项"],
                ["推断题", "隐含逻辑", "选项须在原文中有依据，不过度推断"],
                ["修辞目的题", "作者意图", "理解段落结构，关注转折/举例标志词"],
                ["主旨题", "段落/全文大意", "排除过于具体的细节选项"],
                ["句子插入题", "逻辑衔接", "关注代词指代和连接词逻辑"],
              ]}
            />
          </Card>

          <Card style={{ background: colors.greenSoft, border: `1px solid ${colors.green}` }}>
            <h4 style={{ margin: "0 0 10px", color: colors.green }}>🎯 阅读高分策略</h4>
            {["第一阶段（Stage1）务必认真对待，决定是否进入高分Upper模块",
              "自适应机制下，进入Upper模块的题权重更高，即使错题数相同也能得更高分",
              "模块提交后不可返回修改，每道题要做到确认后再提交",
              "微型文本快攻（30秒-1分钟/组），学术文章精读（5-8分钟/组）",
              "大量积累学术词汇（推荐：托福词汇3500/Barron's高频词）"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green, fontWeight: 700 }}>✓</span><span>{t}</span>
              </div>
            ))}
          </Card>
        </div>
      );
    }

    function ListeningTab() {
      return (
        <div>
          <SectionTitle icon="🎧">听力（Listening）详解</SectionTitle>
          <Card>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
              <Badge color="accent">30题</Badge>
              <Badge color="green">约29分钟</Badge>
              <Badge color="purple">自适应两阶段</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: 0 }}>
              Stage1（15题固定）→ 系统评估 → Stage2（15题，Upper/Lower难度）。录音播完才显示题目，不可回放。
            </p>
          </Card>

          <SubTitle>📂 四大题型详解</SubTitle>

          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
              <h4 style={{ margin: 0, color: colors.text }}>① 听选回复题（Listen & Select Response）</h4>
              <Badge color="yellow">新题型</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "10px 0 6px" }}>
              播放一句日常生活场景中的口头提问或陈述（约30秒），从选项中选出最自然、最恰当的回应方式。共8道，每题1道单选。
            </p>
            <Tip type="info">考查：日常交际理解力 + 表面/隐藏含义识别 + 社交语境反应能力。</Tip>
            <SubTitle>做题要点</SubTitle>
            {["注意听语气：疑问句/感叹句/陈述句对应不同的回应逻辑",
              "此题不可回放，需集中注意力听完整个句子再作答",
              "常见场景：点餐、问路、课堂互动、活动报名等",
              "排除逻辑明显不符的选项，优先选语境最自然的回答",
              "练习方式：多听英语播客/情景对话，积累口语反应模式"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green }}>→</span><span>{t}</span>
              </div>
            ))}
          </Card>

          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
              <h4 style={{ margin: 0, color: colors.text }}>② 日常短对话（Short Conversation）</h4>
              <Badge color="yellow">新题型</Badge>
            </div>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "10px 0 6px" }}>
              约30秒的生活场景对话（餐饮/社交/教育等），附2道单选题。考查对话意图、重要细节及隐含意义。
            </p>
            <SubTitle>做题要点</SubTitle>
            {["重点听\"为什么\"和\"结果是什么\"，而不是每个单词",
              "注意转折词（but/however/actually）后面的内容往往是答题关键",
              "隐含意义题：说话人的情绪/态度往往通过语气体现，而非字面意思",
              "做笔记：记下人物关系、事件、时间等关键信息"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green }}>→</span><span>{t}</span>
              </div>
            ))}
          </Card>

          <Card>
            <h4 style={{ margin: "0 0 10px", color: colors.text }}>③ 学术公告（Academic Announcement）</h4>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "0 0 6px" }}>
              40-85字的校园公告/广播，难度较旧版降低。考查：主旨识别、细节理解、词汇掌握、推断未来行动。
            </p>
            <SubTitle>做题要点</SubTitle>
            {["快速抓取：时间、地点、事件、要求等核心信息",
              "公告类通常有\"通知做某事\"的目的，留意动词指令（must/should/please）",
              "考查\"推断未来行动\"时，要结合全文逻辑而非只看结尾"].map((t, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13.5, color: colors.text }}>
                <span style={{ color: colors.green }}>→</span><span>{t}</span>
              </div>
            ))}
          </Card>

          <Card>
            <h4 style={{ margin: "0 0 10px", color: colors.text }}>④ 学术讲座（Academic Lecture）</h4>
            <p style={{ color: colors.textMuted, fontSize: 13.5, margin: "0 0 6px" }}>
